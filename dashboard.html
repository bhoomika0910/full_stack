<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fruit Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="navbar">
        <h2>Fruit Dashboard</h2>
    </div>

    <div class="container">

        <div class="sidebar">
            <p>🏠 Home</p>
            <p>🍎 Products</p>
            <p>📦 Orders</p>
            <p>👤 Profile</p>
        </div>

        <div class="products">

            <div class="card">
                <img src="https://via.placeholder.com/100?text=🍎" alt="Apple">
                <h3>Apple</h3>
            </div>

            <div class="card">
                <img src="https://via.placeholder.com/100?text=🍌" alt="Banana">
                <h3>Banana</h3>
            </div>

            <div class="card">
                <img src="https://via.placeholder.com/100?text=🍇" alt="Grapes">
                <h3>Grapes</h3>
            </div>

            <div class="card">
                <img src="https://via.placeholder.com/100?text=🍓" alt="Strawberry">
                <h3>Strawberry</h3>
            </div>

            <div class="card">
                <img src="https://via.placeholder.com/100?text=🥭" alt="Mango">
                <h3>Mango</h3>
            </div>

            <div class="card">
                <img src="https://via.placeholder.com/100?text=🍍" alt="Pineapple">
                <h3>Pineapple</h3>
            </div>

        </div>

    </div>

</body>
</html>
