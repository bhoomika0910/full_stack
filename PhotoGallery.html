<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3x3 Photo Gallery</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: purple;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: Arial, sans-serif;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(3, 180px);
      gap: 20px;
    }

    .box {
      width: 180px;
      height: 180px;
      background: white;
      border-radius: 10px;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 20px;
      color: #666;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }

    .box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
  </style>
</head>
<body>

  <div class="gallery">
    <div class="box">Photo 1</div>
    <div class="box">Photo 2</div>
    <div class="box">Photo 3</div>

    <div class="box">Photo 4></div>
    <div class="box">Photo 5></div>
    <div class="box">Photo 6></div>

    <div class="box">"Photo 7"></div>
    <div class="box">Photo 8></div>
    <div class="box">Photo 9</div>
  </div>

</body>
</html>
