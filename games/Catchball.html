<!DOCTYPE html>
<html>
<head>
    <title>Catch the Ball</title>

    <style>
        #game {
            width: 500px;
            height: 400px;
            border: 2px solid black;
            position: relative;
            overflow: hidden;
        }

        #basket {
            width: 80px;
            height: 30px;
            background-color: blue;
            position: absolute;
            bottom: 10px;
            left: 200px;
        }

        #ball {
            width: 30px;
            height: 30px;
            background-color: red;
            border-radius: 50%;
            position: absolute;
            top: 0px;
        }
    </style>
</head>

<body>

    <h1>Catch the Ball</h1>

    <p>Use Left and Right Arrow Keys</p>

    <p>Score: <span id="score">0</span></p>
    <p>Misses: <span id="miss">0</span></p>

    <div id="game">
        <div id="ball"></div>
        <div id="basket"></div>
    </div>

    <h2 id="message"></h2>

    <script>

        let basket = document.getElementById("basket");
        let ball = document.getElementById("ball");

        let basketX = 200;
        let ballX;
        let ballY = 0;

        let score = 0;
        let misses = 0;

        // Move basket

        document.addEventListener("keydown", function(event) {

            if (event.key == "ArrowLeft") {
                basketX = basketX - 20;
            }

            if (event.key == "ArrowRight") {
                basketX = basketX + 20;
            }

            if (basketX < 0) {
                basketX = 0;
            }

            if (basketX > 420) {
                basketX = 420;
            }

            basket.style.left = basketX + "px";

        });


        // Create ball at random position

        function newBall() {

            ballX = Math.floor(Math.random() * 470);
            ballY = 0;

            ball.style.left = ballX + "px";
            ball.style.top = ballY + "px";
        }

        newBall();


        // Make ball fall

        let game = setInterval(function() {

            ballY = ballY + 5;

            ball.style.top = ballY + "px";


            // Check catch

            if (ballY > 340) {

                if (ballX > basketX - 30 && ballX < basketX + 80) {

                    score++;

                    document.getElementById("score").innerText = score;

                }
                else {

                    misses++;

                    document.getElementById("miss").innerText = misses;
                }

                if (misses == 3) {

                    clearInterval(game);

                    document.getElementById("message").innerText =
                        "Game Over!";
                }

                newBall();
            }

        }, 50);

    </script>

</body>
</html>
