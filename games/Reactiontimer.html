<!DOCTYPE html>
<html>
<head>
    <title>Reaction Timer</title>

    <style>
        #box {
            width: 400px;
            height: 250px;
            background-color: lightgray;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 25px;
        }

        .green {
            background-color: green !important;
        }
    </style>
</head>

<body>

    <h1>Reaction Timer</h1>

    <div id="box">
        Click to Start
    </div>

    <p id="result"></p>
    <p id="best"></p>

    <script>

        let box = document.getElementById("box");
        let result = document.getElementById("result");

        let startTime;
        let timer;
        let waiting = false;

        box.onclick = function() {

            // First click
            if (!waiting && !startTime) {

                box.innerText = "Wait for green...";
                waiting = true;

                let delay = Math.floor(Math.random() * 3000) + 2000;

                timer = setTimeout(function() {

                    box.classList.add("green");
                    box.innerText = "CLICK!";

                    startTime = Date.now();

                }, delay);
            }

            // Clicked too early
            else if (waiting && !startTime) {

                clearTimeout(timer);

                result.innerText = "Too early! Click again to start.";

                waiting = false;
            }

            // Correct click
            else {

                let reactionTime = Date.now() - startTime;

                result.innerText = "Your time: " + reactionTime + " ms";

                let best = localStorage.getItem("bestTime");

                if (best == null || reactionTime < best) {

                    localStorage.setItem("bestTime", reactionTime);

                    result.innerText += " New Best Time!";
                }

                document.getElementById("best").innerText =
                    "Best Time: " + localStorage.getItem("bestTime") + " ms";

                box.classList.remove("green");
                box.innerText = "Click to Start";

                startTime = null;
                waiting = false;
            }

        };

    </script>

</body>
</html>
