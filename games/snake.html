<!DOCTYPE html>
<html>
<head>
    <title>Snake Game</title>

    <style>
        #game {
            width: 400px;
            height: 400px;
            border: 2px solid black;
            position: relative;
            background-color: lightgray;
        }

        .snake {
            width: 20px;
            height: 20px;
            background-color: green;
            position: absolute;
        }

        #food {
            width: 20px;
            height: 20px;
            background-color: red;
            position: absolute;
        }
    </style>
</head>

<body>

    <h1>Snake Game</h1>

    <p>Use Arrow Keys</p>

    <div id="game"></div>

    <h2 id="message"></h2>

    <script>

        let game = document.getElementById("game");

        let snake = [
            { x: 200, y: 200 }
        ];

        let food = {
            x: 100,
            y: 100
        };

        let direction = "right";


        // Create food
        function showFood() {

            let foodDiv = document.createElement("div");

            foodDiv.id = "food";

            foodDiv.style.left = food.x + "px";
            foodDiv.style.top = food.y + "px";

            game.appendChild(foodDiv);
        }

        showFood();


        // Change direction

        document.addEventListener("keydown", function(event) {

            if (event.key == "ArrowUp" && direction != "down") {
                direction = "up";
            }

            if (event.key == "ArrowDown" && direction != "up") {
                direction = "down";
            }

            if (event.key == "ArrowLeft" && direction != "right") {
                direction = "left";
            }

            if (event.key == "ArrowRight" && direction != "left") {
                direction = "right";
            }

        });


        // Move snake

        let gameLoop = setInterval(function() {

            let head = {
                x: snake[0].x,
                y: snake[0].y
            };


            if (direction == "up") {
                head.y = head.y - 20;
            }

            if (direction == "down") {
                head.y = head.y + 20;
            }

            if (direction == "left") {
                head.x = head.x - 20;
            }

            if (direction == "right") {
                head.x = head.x + 20;
            }


            // Wall collision

            if (
                head.x < 0 ||
                head.x >= 400 ||
                head.y < 0 ||
                head.y >= 400
            ) {

                clearInterval(gameLoop);

                document.getElementById("message").innerText =
                    "Game Over!";

                return;
            }


            // Snake collision

            for (let i = 0; i < snake.length; i++) {

                if (
                    head.x == snake[i].x &&
                    head.y == snake[i].y
                ) {

                    clearInterval(gameLoop);

                    document.getElementById("message").innerText =
                        "Game Over!";

                    return;
                }
            }


            // Add new head

            snake.unshift(head);


            // Food collision

            if (
                head.x == food.x &&
                head.y == food.y
            ) {

                food.x = Math.floor(Math.random() * 20) * 20;
                food.y = Math.floor(Math.random() * 20) * 20;

                document.getElementById("food").style.left =
                    food.x + "px";

                document.getElementById("food").style.top =
                    food.y + "px";

            }
            else {

                snake.pop();

            }


            // Draw snake

            let oldSnake = document.querySelectorAll(".snake");

            oldSnake.forEach(function(part) {
                part.remove();
            });


            for (let i = 0; i < snake.length; i++) {

                let part = document.createElement("div");

                part.classList.add("snake");

                part.style.left = snake[i].x + "px";
                part.style.top = snake[i].y + "px";

                game.appendChild(part);
            }

        }, 150);

    </script>

</body>
</html>
