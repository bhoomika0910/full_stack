<!DOCTYPE html>
<html lang="en">
<head>
    <meta` charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baisc Photo Gallery</title>
</head>
<style>
    *{
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }
    .box{
        width: 100px;
        height: 110px;
        background-color: rgb(194, 122, 236);
        border-radius: 10px;
        display: flex;
        justify-content: center;
        align-items: center;
    }
    .container{
        display: grid;
        grid-column: span 10;
        grid-template-columns: repeat(3, 1fr);
        gap:10px;
        height: 1000px;
        background-color:white;
        border-radius: 10px;
        display: flex;
        justify-content: center;
        align-items: center;
    }
    </style>
<body>
    <div class="container">
    <div class="box"> Photo 1</div>
    <div class="box"> Photo 2</div>
    <div class="box"> Photo 3</div> 
    <div class="box"> Photo 4</div>
    <div class="box"> Photo 5</div>
    <div class="box"> Photo 6</div>
    <div class="box"> Photo 7</div>
    <div class="box"> Photo 8</div>
    <div class="box"> Photo 9</div>
    </div>
</body>
</html>
