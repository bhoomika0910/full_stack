<!DOCTYPE html>
<html>
    <head>
        <style>
            .container{
                display: grid;
                grid-template-columns: 1fr 1fr 1fr;
                grid-template-rows: 1fr 1fr 1fr;
                outline:1px solid black;
                height:500px;
                width: 500px;
            }
            .container>div{
                font-size:30px;
                outline:1px dashed grey;
            }
            #box1{
                grid-column : 1/3;
                grid-row: 1/3;
                background-color: lightblue;
                z-index:2;
            }
            #box6{
                grid-column: 2/3;
                grid-row: 1/2;
                background-color: lightgreen;
                z-index:1;
            }
            .parent{
                display:grid;
                grid-column:1/3;
                grid-row: 1/3;
                grid-template-columns: subgrid;
                grid-template-rows: subgrid;
                font-size:30px;
                background-color: lightblue;
            }
            .child{
                background-color: red;
                grid-column:1/2;
                grid-row:1/2;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <div class="parent">
                <div class="child">Child</div>
            </div>
        </div>
</html>
