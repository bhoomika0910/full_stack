<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boxes</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        .container{
            display: flex;
            flex-direction: column;
            
        }
        .box1{
            height: 400px;
            background-color: rgb(35, 119, 147);
            margin: 0px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
        }
        .box2{
            height: 400px;
            background-color: rgb(147, 35, 123);
            margin: 0px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
        }
        .box3{
            height: 400px;
            background-color: rgb(48, 147, 35);
            margin: 0px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
        }
        .box4{            
            height: 400px;
            background-color: rgb(147, 136, 35);
            margin: 0px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
        }
        .box5{           
            height: 400px;
            background-color: rgb(69, 236, 236);
            margin: 0px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box1">1</div>
        <div class="box2">2</div>
        <div class="box3">3</div>
        <div class="box4">4</div>
        <div class="box5">5</div>
    </div>
</body>
</html>
